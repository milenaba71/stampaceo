<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Mycroclean Italia® - DDT</title>
<style>
@page{size:A4;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Helvetica,Arial,sans-serif;color:#1B2A4A;font-size:9pt;background:#f0f4f8}
.page{width:210mm;min-height:297mm;background:#fff;margin:0 auto;position:relative;padding-bottom:20mm}
.header{background:#1B2A4A;padding:14px 20mm;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:14px}
.logo-img{width:48px;height:48px;border-radius:50%;background:#fff;padding:3px}
.company-name{color:#fff;font-size:18pt;font-weight:700}
.company-sub{color:#fff;font-size:9pt}
.company-desc{color:#8899aa;font-size:7pt;margin-top:3px}
.badge{background:#D6246E;color:#fff;border-radius:6px;padding:8px 16px;text-align:center}
.badge-label{font-size:7pt;color:#FFB0CC;font-weight:700}
.badge-num{font-size:14pt;font-weight:700}
.meta-row{padding:10px 20mm 0;display:flex;gap:20px;flex-wrap:wrap}
.meta-item .label{font-size:7pt;color:#6B7B8D;text-transform:uppercase;letter-spacing:.4px}
.meta-item .value{font-size:9pt;font-weight:700;margin-top:2px}
.three-cols{margin:10px 20mm 0;display:flex;gap:10px}
.box{flex:1;background:#F0F4F8;border-radius:6px;padding:10px 14px}
.box-mitt{border-left:3px solid #1B2A4A}
.box-dest{border-left:3px solid #D6246E}
.box-trasp{border-left:3px solid #8899aa}
.box-label{font-size:7pt;color:#6B7B8D;text-transform:uppercase;letter-spacing:.4px}
.box-value{font-size:10pt;font-weight:700;margin-top:3px}
.box-sub{font-size:7.5pt;color:#6B7B8D;margin-top:2px}
.section{padding:10px 20mm 0}
.section-title{font-size:9pt;font-weight:700;display:inline-block;border-bottom:2px solid #D6246E;padding-bottom:2px;margin-bottom:8px}
.dot{display:inline-block;width:6px;height:6px;background:#D6246E;border-radius:50%;margin-right:6px;vertical-align:middle}
table{width:100%;border-collapse:collapse;margin-top:4px}
thead th{background:#1B2A4A;color:#fff;font-size:6.5pt;padding:5px 6px;text-align:left;font-weight:700}
thead th.ctr{text-align:center}
thead th.rgt{text-align:right}
tbody td{padding:4px 6px;font-size:7.5pt;border-bottom:1px solid #D0D8E0;text-align:left}
tbody td.ctr{text-align:center}
tbody td.rgt{text-align:right}
tbody tr:nth-child(even){background:#F0F4F8}
.total-row{background:#E8DCF0!important;font-weight:700}
.total-row td{border-top:2px solid #D6246E}
.signatures{padding:16px 20mm 0;display:flex;justify-content:space-between;gap:12px}
.sig-box{flex:1}
.sig-box .lbl{font-size:7pt;color:#6B7B8D}
.sig-line{border-top:1px solid #D0D8E0;margin-top:28px;padding-top:3px;font-size:6.5pt;color:#6B7B8D}
.certs{padding:10px 20mm 0;display:flex;align-items:center;gap:16px;justify-content:center}
.certs img{height:40px}
.footer{position:absolute;bottom:0;left:0;right:0}
.footer-line{border-top:2px solid #D6246E;margin:0 20mm}
.footer-text{text-align:center;padding:4px 0;font-size:6pt;color:#6B7B8D}
.footer-bar{background:#1B2A4A;padding:3px;text-align:center;color:#fff;font-size:5pt;font-weight:700;letter-spacing:2px}
.controls{text-align:center;padding:16px;background:#f0f4f8}
.btn{padding:12px 36px;background:#1B2A4A;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin:4px}
.btn:hover{background:#0f1a30}
.error-box{text-align:center;padding:60px;color:#D6246E}
.error-box h2{margin-bottom:10px}
.error-box pre{text-align:left;background:#fff;padding:10px;border-radius:6px;font-size:10px;margin-top:10px;overflow:auto;max-width:600px;margin:10px auto}
@media print{.controls{display:none}.page{margin:0;box-shadow:none}body{background:#fff}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}}
</style>

// ============================================================
// DECOMPRESSIONE: Base64 URL-safe → JSON
// ============================================================
function fromBase64(str) {
    // Ripristina base64 standard da URL-safe
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    // Aggiungi padding se necessario
    while (str.length % 4) str += '=';
    try {
        var binary = atob(str);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
    } catch(e) {
        return null;
    }
}

// Espande chiavi abbreviate in chiavi complete
function expandData(o) {
    if (!o) return null;
    var righe = (o.r || []).map(function(r) {
        return {
            codice:       r.c || '',
            descrizione:  r.d || '',
            um:           r.u || 'pz',
            quantita:     r.q || 0,
            qty_rientrata: r.r || '',
            qty_in_lab:   r.l !== undefined ? r.l : '',
            note:         r.n || ''
        };
    });
    return {
        numero_ddt:    o.n || '',
        data:          o.d || '',
        stato:         o.s || '',
        trasporto:     o.t || '',
        numero_colli:  o.nc || '',
        aspetto_colli: o.ac || '',
        peso:          o.p || '',
        destinatario:  o.ds || '',
        indirizzo_dest: o.id || '',
        email_dest:    o.ed || '',
        piva_dest:     o.pv || '',
        ordine_rif:    o.or || '',
        causale:       o.ca || 'Vendita',
        righe:         righe
    };
}

// ============================================================
// CARICAMENTO DATI
// ============================================================
var params = new URLSearchParams(window.location.search);
var o = null;
var loadError = null;

// Nuovo parametro: ?b= (base64 compresso)
var b64 = params.get('b');
if (b64) {
    try {
        var jsonStr = fromBase64(b64);
        if (!jsonStr) throw new Error('Decodifica Base64 fallita');
        var raw = JSON.parse(jsonStr);
        o = expandData(raw);
    } catch(e) {
        loadError = 'Errore decompressione dati: ' + e.message;
    }
}

// Compatibilità vecchio parametro: ?data= (JSON raw)
if (!o && !loadError) {
    var dp = params.get('data');
    if (dp) {
        try {
            o = JSON.parse(decodeURIComponent(dp));
        } catch(e) {
            try { o = JSON.parse(dp); } catch(e2) {
                loadError = 'Errore parsing JSON: ' + e2.message;
            }
        }
    }
}

// ============================================================
// HELPER
// ============================================================
function fD(d) {
    if (!d) return '—';
    try { return new Date(d).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric'}); }
    catch(e) { return String(d); }
}

// ============================================================
// RENDER
// ============================================================
function render(o) {
    var righe = o.righe || [];
    var rH = '';
    var totQty = 0;
    righe.forEach(function(r, i) {
        var q = r.quantita || 0;
        totQty += q;
        rH += '<tr>' +
            '<td class="ctr">' + (i+1) + '</td>' +
            '<td>' + (r.codice || '') + '</td>' +
            '<td>' + (r.descrizione || '') + '</td>' +
            '<td class="ctr">' + (r.um || 'pz') + '</td>' +
            '<td class="rgt">' + (q || '') + '</td>' +
            '<td class="rgt">' + (r.qty_rientrata || '') + '</td>' +
            '<td class="rgt">' + (r.qty_in_lab !== '' ? r.qty_in_lab : '') + '</td>' +
            '<td>' + (r.note || '') + '</td>' +
            '</tr>';
    });
    rH += '<tr class="total-row">' +
        '<td colspan="4"></td>' +
        '<td class="rgt" style="border-top:2px solid #D6246E">' + totQty + '</td>' +
        '<td colspan="3" style="border-top:2px solid #D6246E"></td>' +
        '</tr>';

    document.getElementById('app').innerHTML =
        '<div class="controls">' +
            '<button class="btn" onclick="window.print()">🖨️ Stampa / Salva PDF</button> ' +
            '<button class="btn" onclick="window.close()">✕ Chiudi</button>' +
        '</div>' +
        '<div class="page">' +
            '<div class="header">' +
                '<div class="header-left">' +
                    '<img class="logo-img" src="' + LOGO + '">' +
                    '<div>' +
                        '<div class="company-name">MYCROCLEAN</div>' +
                        '<div class="company-sub">ITALIA®</div>' +
                        '<div class="company-desc">Documento di Trasporto</div>' +
                    '</div>' +
                '</div>' +
                '<div class="badge">' +
                    '<div class="badge-label">DDT N°</div>' +
                    '<div class="badge-num">' + (o.numero_ddt || '') + '</div>' +
                '</div>' +
            '</div>' +

            '<div class="meta-row">' +
                '<div class="meta-item"><div class="label">DATA DDT</div><div class="value">' + fD(o.data) + '</div></div>' +
                '<div class="meta-item"><div class="label">STATO</div><div class="value">' + (o.stato || '') + '</div></div>' +
                '<div class="meta-item"><div class="label">TRASPORTO</div><div class="value">' + (o.trasporto || '') + '</div></div>' +
                '<div class="meta-item"><div class="label">N. COLLI</div><div class="value">' + (o.numero_colli || '') + '</div></div>' +
                '<div class="meta-item"><div class="label">ASPETTO COLLI</div><div class="value">' + (o.aspetto_colli || '') + '</div></div>' +
                '<div class="meta-item"><div class="label">PESO</div><div class="value">' + (o.peso || '') + '</div></div>' +
            '</div>' +

            '<div class="three-cols">' +
                '<div class="box box-mitt">' +
                    '<div class="box-label">MITTENTE</div>' +
                    '<div class="box-value">Mycroclean Italia® SRL</div>' +
                    '<div class="box-sub">VIA CARLO PORTA, 14 - 20064 GORGONZOLA (MI)</div>' +
                    '<div class="box-sub">P.IVA 03702820964</div>' +
                    '<div class="box-sub">Tel. 02 95300368 | info@mycroclean.it</div>' +
                '</div>' +
                '<div class="box box-dest">' +
                    '<div class="box-label">DESTINATARIO</div>' +
                    '<div class="box-value">' + (o.destinatario || '—') + '</div>' +
                    (o.indirizzo_dest ? '<div class="box-sub">' + o.indirizzo_dest + '</div>' : '') +
                    (o.piva_dest ? '<div class="box-sub">P.IVA: ' + o.piva_dest + '</div>' : '') +
                    (o.email_dest ? '<div class="box-sub">✉ ' + o.email_dest + '</div>' : '') +
                '</div>' +
                '<div class="box box-trasp">' +
                    '<div class="box-label">CAUSALE TRASPORTO</div>' +
                    '<div class="box-value">' + (o.causale || 'Vendita') + '</div>' +
                    (o.ordine_rif ? '<div class="box-sub">Rif. Ordine: ' + o.ordine_rif + '</div>' : '') +
                '</div>' +
            '</div>' +

            '<div class="section">' +
                '<div class="dot"></div><span class="section-title">RIGHE DDT</span>' +
                '<table>' +
                    '<thead><tr>' +
                        '<th class="ctr" style="width:28px">#</th>' +
                        '<th style="width:100px">Codice</th>' +
                        '<th>Descrizione</th>' +
                        '<th class="ctr" style="width:35px">U.M.</th>' +
                        '<th class="rgt" style="width:42px">Qtà</th>' +
                        '<th class="rgt" style="width:55px">Rientrata</th>' +
                        '<th class="rgt" style="width:45px">In Lab.</th>' +
                        '<th>Note</th>' +
                    '</tr></thead>' +
                    '<tbody>' + rH + '</tbody>' +
                '</table>' +
            '</div>' +

            '<div class="signatures">' +
                '<div class="sig-box"><div class="lbl">Firma mittente</div><div class="sig-line">Mycroclean Italia®</div></div>' +
                '<div class="sig-box"><div class="lbl">Firma vettore</div><div class="sig-line">Timbro e firma</div></div>' +
                '<div class="sig-box"><div class="lbl">Firma destinatario</div><div class="sig-line">Timbro e firma</div></div>' +
            '</div>' +

            '<div class="footer">' +
                '<div class="footer-line"></div>' +
                '<div class="footer-text">Mycroclean Italia® | Via Carlo Porta, 14 - 20064 Gorgonzola (MI) | P.IVA 03702820964 | Tel. 02 95300368 | info@mycroclean.it</div>' +
                '<div class="footer-bar">MYCROCLEAN ITALIA®</div>' +
            '</div>' +
        '</div>';
}

// ============================================================
// MAIN
// ============================================================
if (o) {
    render(o);
    if (params.get('print') === '1') setTimeout(function() { window.print(); }, 800);
} else if (loadError) {
    document.getElementById('app').innerHTML =
        '<div class="error-box">' +
            '<h2>⚠️ Errore caricamento dati</h2>' +
            '<p>' + loadError + '</p>' +
            '<p style="margin-top:8px;font-size:11px;color:#999">Controlla la console del browser per dettagli (F12)</p>' +
        '</div>';
} else {
    // Nessun parametro: mostra form manuale
    document.getElementById('app').innerHTML =
        '<div class="controls" style="min-height:100vh;display:flex;align-items:center;justify-content:center">' +
            '<div style="text-align:center">' +
                '<img src="' + LOGO + '" style="width:50px;border-radius:50%;margin-bottom:14px">' +
                '<h2 style="color:#1B2A4A;margin-bottom:8px">Mycroclean — DDT</h2>' +
                '<p style="color:#6B7B8D;margin-bottom:14px;font-size:13px">Incolla il JSON (oppure usa il link generato da Airtable):</p>' +
                '<textarea id="ji" style="width:400px;height:200px;border:2px solid #D0D8E0;border-radius:8px;padding:10px;font-size:11px;font-family:monospace;resize:vertical"></textarea>' +
                '<br><button class="btn" style="margin-top:10px" onclick="loadJ()">Carica</button>' +
            '</div>' +
        '</div>';
}

function loadJ() {
    try {
        var raw = JSON.parse(document.getElementById('ji').value);
        // Prova a capire se è compresso o espanso
        var expanded = raw.righe ? raw : expandData(raw);
        if (!expanded) throw new Error('Struttura non riconosciuta');
        render(expanded);
    } catch(e) {
        alert('JSON non valido: ' + e.message);
    }
}
</script>
