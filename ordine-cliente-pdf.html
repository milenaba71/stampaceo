<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Mycroclean Italia® - Ordine Cliente</title>
<style>
@page{size:A4 landscape;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Helvetica,Arial,sans-serif;color:#1B2A4A;font-size:8pt;background:#f0f4f8}
.page{width:297mm;min-height:210mm;background:#fff;margin:0 auto;position:relative;padding-bottom:16mm}
.header{background:#1B2A4A;padding:10px 15mm;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:12px}
.logo-img{width:44px;height:44px;border-radius:50%;background:#fff;padding:2px}
.company-name{color:#fff;font-size:15pt;font-weight:700}
.company-sub{color:#D6246E;font-size:8pt;font-weight:600}
.company-desc{color:#8899aa;font-size:6.5pt;margin-top:2px}
.badge{background:#D6246E;color:#fff;border-radius:6px;padding:6px 14px;text-align:center}
.badge-label{font-size:6pt;color:#FFB0CC;font-weight:700}
.badge-num{font-size:13pt;font-weight:700}
.meta-row{padding:8px 15mm 0;display:flex;gap:16px;flex-wrap:wrap}
.meta-item .label{font-size:6.5pt;color:#6B7B8D;text-transform:uppercase;letter-spacing:.4px}
.meta-item .value{font-size:8pt;font-weight:700;margin-top:1px}
.two-cols{margin:8px 15mm 0;display:flex;gap:10px}
.box{flex:1;background:#F0F4F8;border-radius:5px;padding:8px 12px}
.box-cli{border-left:3px solid #1B2A4A}
.box-ord{border-left:3px solid #D6246E}
.box-label{font-size:6.5pt;color:#6B7B8D;text-transform:uppercase;letter-spacing:.4px}
.box-value{font-size:9pt;font-weight:700;margin-top:2px}
.box-sub{font-size:7pt;color:#6B7B8D;margin-top:1px}
.section{padding:8px 15mm 0}
.section-title{font-size:8pt;font-weight:700;display:inline-block;border-bottom:2px solid #D6246E;padding-bottom:2px;margin-bottom:6px}
.dot{display:inline-block;width:5px;height:5px;background:#D6246E;border-radius:50%;margin-right:5px;vertical-align:middle}
table{width:100%;border-collapse:collapse;margin-top:3px}
thead th{background:#1B2A4A;color:#fff;font-size:6.5pt;padding:5px 8px;text-align:left;font-weight:700}
thead th.ctr{text-align:center}
thead th.rgt{text-align:right}
tbody td{padding:4px 8px;font-size:7.5pt;border-bottom:1px solid #D0D8E0;text-align:left}
tbody td.ctr{text-align:center}
tbody td.rgt{text-align:right}
tbody tr:nth-child(even){background:#F0F4F8}
.notes li{font-size:6.5pt;line-height:1.7;list-style:none}
.notes li:before{content:"\2022";color:#D6246E;margin-right:6px;font-weight:700}
.signatures{padding:14px 15mm 0;display:flex;justify-content:space-between}
.sig-box{width:42%}.sig-box .lbl{font-size:6.5pt;color:#6B7B8D}
.sig-line{border-top:1px solid #D0D8E0;margin-top:24px;padding-top:2px;font-size:6pt;color:#6B7B8D}
.footer{position:absolute;bottom:0;left:0;right:0}
.footer-line{border-top:2px solid #D6246E;margin:0 15mm}
.footer-text{text-align:center;padding:3px 0;font-size:5.5pt;color:#6B7B8D}
.footer-bar{background:#1B2A4A;padding:2px;text-align:center;color:#fff;font-size:4.5pt;font-weight:700;letter-spacing:2px}
.controls{text-align:center;padding:14px;background:#f0f4f8}
.btn{padding:10px 32px;background:#1B2A4A;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin:3px}
.btn:hover{background:#0f1a30}
.btn2{background:#D6246E}.btn2:hover{background:#c01e60}
@media print{.controls{display:none}.page{margin:0;box-shadow:none}body{background:#fff}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}}
</style>
</head>
<body>
<div id="app"><div style="text-align:center;padding:60px;color:#6B7B8D">Caricamento...</div></div>
<script>
var LOGO='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0OCIgaGVpZ2h0PSI0OCIgdmlld0JveD0iMCAwIDQ4IDQ4Ij48Y2lyY2xlIGN4PSIyNCIgY3k9IjI0IiByPSIyMyIgZmlsbD0iI2ZmZiIgc3Ryb2tlPSIjMUIyQTRBIiBzdHJva2Utd2lkdGg9IjIiLz48dGV4dCB4PSIyNCIgeT0iMzEiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiMxQjJBNEEiIGZvbnQtZmFtaWx5PSJIZWx2ZXRpY2EsQXJpYWwiIGZvbnQtc2l6ZT0iMjQiIGZvbnQtd2VpZ2h0PSI3MDAiPk08L3RleHQ+PC9zdmc+';
var params=new URLSearchParams(window.location.search);
var dp=params.get('data');var o=null;
if(dp){try{o=JSON.parse(decodeURIComponent(dp))}catch(e){try{o=JSON.parse(dp)}catch(e2){}}}
if(!o){document.getElementById('app').innerHTML='<div class="controls" style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div style="text-align:center"><h2 style="color:#1B2A4A;margin-bottom:8px">Mycroclean \u2014 Ordine Cliente</h2><p style="color:#6B7B8D;margin-bottom:14px;font-size:13px">Incolla il JSON:</p><textarea id="ji" style="width:400px;height:200px;border:2px solid #D0D8E0;border-radius:8px;padding:10px;font-size:11px;font-family:monospace;resize:vertical"></textarea><br><button class="btn" style="margin-top:10px" onclick="loadJ()">Carica</button></div></div>'}else{render(o);if(params.get('print')==='1')setTimeout(function(){window.print()},600)}
function loadJ(){try{o=JSON.parse(document.getElementById('ji').value);render(o)}catch(e){alert('JSON non valido')}}
function fD(d){if(!d)return'\u2014';try{return new Date(d).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return String(d)}}
function render(o){
var righe=o.righe||[];var rH='';var totQty=0;
righe.forEach(function(r,i){
var q=r.quantita||0;totQty+=q;
rH+='<tr>'+
'<td class="ctr">'+(i+1)+'</td>'+
'<td>'+(r.codice||'')+'</td>'+
'<td>'+(r.descrizione||'')+'</td>'+
'<td class="ctr">'+(r.colore||'')+'</td>'+
'<td class="ctr">'+(r.taglia||'')+'</td>'+
'<td class="rgt">'+(q||'')+'</td>'+
'<td class="rgt">'+(r.qty_evasa||'')+'</td>'+
'<td class="rgt">'+(r.qty_da_evadere||'')+'</td>'+
'<td>'+(r.note||'')+'</td>'+
'</tr>'});
rH+='<tr style="background:#E8DCF0;font-weight:700"><td colspan="5" style="border-top:2px solid #D6246E"></td><td style="border-top:2px solid #D6246E;text-align:right">'+totQty+'</td><td colspan="3" style="border-top:2px solid #D6246E"></td></tr>';
var nH='';var nt=o.note||'';if(nt){nt.split('\n').forEach(function(l){if(l.trim())nH+='<li>'+l.trim()+'</li>'})}
document.getElementById('app').innerHTML=
'<div class="controls"><button class="btn" onclick="window.print()">\ud83d\udda8\ufe0f Stampa / Salva PDF</button> <button class="btn" onclick="history.back()">\u2190 Torna</button></div>'+
'<div class="page">'+
'<div class="header"><div class="header-left"><img class="logo-img" src="'+LOGO+'"><div><div class="company-name">MYCROCLEAN</div><div class="company-sub">ITALIA\u00ae</div><div class="company-desc">Conferma Ordine Cliente</div></div></div><div class="badge"><div class="badge-label">ORDINE N\u00b0</div><div class="badge-num">'+(o.numero||'')+'</div></div></div>'+
'<div class="meta-row"><div class="meta-item"><div class="label">DATA ORDINE</div><div class="value">'+fD(o.data)+'</div></div><div class="meta-item"><div class="label">CODICE ORDINE</div><div class="value">'+(o.codice_ordine||'')+'</div></div><div class="meta-item"><div class="label">STATO</div><div class="value">'+(o.stato||'')+'</div></div><div class="meta-item"><div class="label">CONSEGNA PREVISTA</div><div class="value">'+fD(o.data_consegna)+'</div></div>'+(o.lotto?'<div class="meta-item"><div class="label">LOTTO</div><div class="value">'+o.lotto+'</div></div>':'')+(o.codice_texo?'<div class="meta-item"><div class="label">COD. TEXO</div><div class="value">'+o.codice_texo+'</div></div>':'')+'</div>'+
'<div class="two-cols"><div class="box box-cli"><div class="box-label">CLIENTE</div><div class="box-value">'+(o.cliente||'\u2014')+'</div>'+(o.indirizzo_cliente?'<div class="box-sub">'+o.indirizzo_cliente+'</div>':'')+(o.telefono_cliente?'<div class="box-sub">\u260e '+o.telefono_cliente+'</div>':'')+(o.email_cliente?'<div class="box-sub">\u2709 '+o.email_cliente+'</div>':'')+(o.piva_cliente?'<div class="box-sub">P.IVA: '+o.piva_cliente+'</div>':'')+'</div><div class="box box-ord"><div class="box-label">RIF. ORDINE CLIENTE</div><div class="box-value">'+(o.ordine_cliente||'\u2014')+'</div>'+(o.note_cliente?'<div class="box-sub">'+o.note_cliente+'</div>':'')+'</div></div>'+
(o.corpo?'<div class="section"><div class="dot"></div><span style="font-size:6.5pt;color:#6B7B8D;text-transform:uppercase">CONDIZIONI</span><div style="font-size:7pt;line-height:1.5;margin-top:3px;white-space:pre-line">'+o.corpo+'</div></div>':'')+
'<div class="section"><div class="dot"></div><span class="section-title">RIGHE ORDINE</span><table><thead><tr><th class="ctr">#</th><th>Codice</th><th>Descrizione</th><th class="ctr">Colore</th><th class="ctr">Taglia</th><th class="rgt">Qt\u00e0</th><th class="rgt">Evasa</th><th class="rgt">Da Evadere</th><th>Note</th></tr></thead><tbody>'+rH+'</tbody></table></div>'+
(nH?'<div class="section"><div class="dot"></div><span class="section-title">NOTE ORDINE</span><ul class="notes">'+nH+'</ul></div>':'')+
'<div class="signatures"><div class="sig-box"><div class="lbl">Mycroclean Italia\u00ae</div><div class="sig-line">Firma e timbro</div></div><div class="sig-box"><div class="lbl">Cliente per accettazione</div><div class="sig-line">Firma e timbro</div></div></div>'+
'<div class="footer"><div class="footer-line"></div><div class="footer-text">Mycroclean Italia\u00ae | Tel. 02 95300368 | info@mycroclean.it | Indumenti Clean Room</div><div class="footer-bar">MYCROCLEAN ITALIA\u00ae</div></div></div>'}
</script>
</body>
</html>
